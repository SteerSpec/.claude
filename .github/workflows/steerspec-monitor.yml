name: SteerSpec Monitor

# Weekly drift check: compares every target repo's managed files with the
# deployment state and opens (or closes) a `steerspec-drift` issue per repo.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SteerSpec/strspc-sync/monitor@v0.2.6
        with:
          # Reads the targets and opens issues in them: the App token, not GITHUB_TOKEN.
          app-id: ${{ secrets.STEERSPEC_APP_ID }}
          private-key: ${{ secrets.STEERSPEC_PRIVATE_KEY }}
