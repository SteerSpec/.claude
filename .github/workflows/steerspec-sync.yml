name: SteerSpec Sync

# Dogfood. Opens a PR in every target repo (see steerspec-sync.yml) whenever the
# managed templates change, authored by the steerspec-sync App: its PRs get CI
# and auto-approve in the target repos, which GITHUB_TOKEN-caused events never
# do, and its commits are GitHub-signed. The run also writes
# .steerspec/deployment-state.json back to this repo's main; the App is a
# bypass actor on the pr-mandatory ruleset for exactly that write.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'steerspec-sync.yml'
      - '.github/workflows/steerspec-sync.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run: list what would be synced, write nothing'
        type: boolean
        default: true
      force:
        description: 'Re-sync even where the stored content hash matches'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Two overlapping runs would race on the deployment-state file.
    concurrency:
      group: steerspec-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: SteerSpec/strspc-sync/sync@v0.2.3
        with:
          # ORed with sync.dry-run in steerspec-sync.yml: either one makes a dry run.
          dry-run: ${{ inputs.dry-run || false }}
          force: ${{ inputs.force || false }}
          app-id: ${{ secrets.STEERSPEC_APP_ID }}
          private-key: ${{ secrets.STEERSPEC_PRIVATE_KEY }}
