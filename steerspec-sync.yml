version: "1.0.0"

# SteerSpec dogfoods strspc-sync: this repo is the central config and the
# other SteerSpec repos are the targets. In GitHub Actions central-repo is
# inferred from GITHUB_REPOSITORY; it is set here so `strspc sync --dry-run`
# also works from a local checkout.
central-repo: SteerSpec/.claude

auth:
  method: github-app
  # STEERSPEC_APP_ID and STEERSPEC_PRIVATE_KEY reach the binary through the
  # workflow's app-id / private-key inputs (org secrets). The steerspec-sync App
  # is installed on every SteerSpec repo; its Contents-API commits are
  # GitHub-signed, which the enterprise required_signatures rule demands, and it
  # is a bypass actor on the pr-mandatory ruleset so the deployment-state write
  # back to this repo's main lands without a PR.

templates:
  # The org-standards block of every repo's CLAUDE.md. Marker strategy: only
  # the STEERSPEC:BEGIN/END section is managed and the rest of the file is kept;
  # a repo without a CLAUDE.md receives the whole template. Mustache variables
  # are not expanded in marker mode, so the template uses none.
  - id: claude-md
    version: "1.0.3"
    type: claude-md
    source: templates/CLAUDE.md.mustache
    destination: CLAUDE.md
    strategy: marker

  # Keeps the strspc-sync action pins in every target repo current: Dependabot
  # opens one grouped PR per new tag. full-replace overwrites a target's own
  # dependabot.yml, so repos with extra ecosystems are excluded under targets.overrides.
  - id: dependabot
    version: "1.0.1"
    type: config
    source: templates/dependabot.yml
    destination: .github/dependabot.yml
    strategy: full-replace

  # The required pr-title check, pinned by SHA (SteerSpec/.github#34). It runs
  # under pull_request_target with a token, so a movable tag must not decide
  # what runs. full-replace keeps one copy for every repo that has this check;
  # repos that check titles another way are excluded under targets.overrides.
  - id: pr-title
    version: "1.0.0"
    type: config
    source: templates/pr-title.yml
    destination: .github/workflows/pr-title.yml
    strategy: full-replace

  # The four agents in agents/ are delivered by the strspc-agents plugin from
  # this marketplace. Syncing them as files as well would open four more PRs
  # per repo for a duplicate copy, so they stay plugin-only until the owner
  # decides whether the plugin or the synced files are the canonical channel.

# Resolves to ten repos today: strspc-rules, strspc-manager, strspc-CLI,
# strspc-sync, strspc-pr-review, strspc-pr-approval, strspc-www, strspc-spec,
# strspc-cloud and homebrew-tap
# (strspc-www and strspc-cloud are not public; the App is installed on every repo of the org,
# so discovery sees them).
targets:
  include:
    - "SteerSpec/*"
  exclude:
    - "SteerSpec/.claude"            # this repo
    - "SteerSpec/.github"
    - "SteerSpec/.github-private"
    - "SteerSpec/main"               # archived; discovery does not filter archived repos
    - "SteerSpec/strspc-marketing"

  # These repos keep an npm ecosystem (and repo-specific settings) in their own
  # dependabot.yml, which the full-replace dependabot template would overwrite.
  #
  # pr-title goes only to the repos whose required title check is pr-title.yml
  # (rules, manager, CLI, sync, www). The others check titles another way: a
  # job in ci.yml (spec, pr-approval), commitlint (homebrew-tap), or not at all
  # (pr-review, cloud).
  overrides:
    - repo: SteerSpec/strspc-pr-review
      exclude_templates:
        - dependabot
        - pr-title
    - repo: SteerSpec/strspc-www
      exclude_templates:
        - dependabot
    # Copied from strspc-pr-review: npm ecosystem, commitlint group, fix: prefix
    # (action.yml pins ship to consumers, so a bump must release).
    - repo: SteerSpec/strspc-pr-approval
      exclude_templates:
        - dependabot
        - pr-title
    # A Homebrew tap has no rules/ realm, so the org-standards CLAUDE.md block
    # does not apply; it still takes the dependabot template.
    - repo: SteerSpec/homebrew-tap
      exclude_templates:
        - claude-md
        - pr-title
    - repo: SteerSpec/strspc-spec
      exclude_templates:
        - pr-title
    - repo: SteerSpec/strspc-cloud
      exclude_templates:
        - pr-title

sync:
  concurrency: 3
  pr-label: steerspec-sync
  close-stale-prs: true
  # Commit messages and PR titles default to the conventional-commit form
  # `chore(steerspec-sync): update <template> to <version>`, which satisfies
  # commitlint (rules, manager) and action-semantic-pull-request (CLI).
  #
  # The first landing (PR #17) ran dry: run 40229581784 resolved the eight
  # targets and reported every one as a planned PR with no errors. Live now:
  # each run opens or updates the PRs and writes .steerspec/deployment-state.json,
  # which monitor and conflict then read. Set to true (or dispatch the workflow
  # with dry-run on) to rehearse a template change without writing anything.
  dry-run: false

monitor:
  schedule: "0 8 * * 1"
  issue-label: steerspec-drift
  auto-close: true

conflicts:
  schedule: "0 9 * * 1"
  tiers: [1, 2]
  issue-label: steerspec-conflict
